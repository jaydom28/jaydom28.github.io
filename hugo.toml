baseURL = "https://jaydom28.github.io"
enableEmoji = true
defaultContentLanguage = "en"

# Automatically generate robots.txt
enableRobotsTXT = true
languageCode = "en"
theme = "gokarna"
title = "Justin Dom"

[params]
  fontsize = "1.2rem"
  avatarURL = "/images/profile.jpg"
  description = "Professional software breaker, okay pianist"
  footer = "Justin Dom"
  metaKeywords = ["blog", "gokarna", "hugo", "justin dom", "justindom", "desktopdump", "juicestain productions"]
  showBackToTopButton = true # true or false for "back to top" button on posts and pages
  socialIcons = [
    {name = "github", url = "https://github.com/jaydom28"},
    {name = "linkedin", url = "https://linkedin.com/in/justin-d-b03724121"},
  ]

[menu]
  [[menu.main]]
    name = "Home"
    pre = "<span data-feather='home'></span>"
    url = "/"
    # Lower weights are listed first in the menu (leftmost); higher weights are
    # listed last in the menu (rightmost)
    weight = 1

  [[menu.main]]
    # Display name
    name = "Posts"
    pre = "<span data-feather='book'></span>"
    # Relative URL slug (appended to baseURL)
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    pre = "<span data-feather='tag'></span>"
    weight = 3

[minify]
  minifyOutput = true
